name: Actualizador Diario y Liquidación NBA V2

on:
  schedule:
    # 1. Mañana (07:00 CDMX = 13:00 UTC): Ingesta de partidos, apertura de cuotas y predicciones tempranas
    - cron: '0 13 * * *'
    # 2. Tarde (16:00 CDMX = 22:00 UTC): Ajuste de líneas de mercado (DraftKings) previas al inicio de la jornada
    - cron: '0 22 * * *'
    # 3. Noche / Cierre (23:30 CDMX = 05:30 UTC siguiente día): Liquidación final de resultados, auditoría de unidades y ROI
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-v2-pipeline
  cancel-in-progress: false

jobs:
  actualizar-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib requests pyarrow mysql-connector-python

      - name: Ejecutar Pipeline NBA (Liquidación de marcadores y nuevas predicciones)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python nba/actualizar_nba.py

      - name: Sincronizar y respaldar predicciones e historial en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nba/
          if git diff --staged --quiet; then
            echo "Sin cambios pendientes en archivos locales de NBA."
          else
            git commit -m "chore(nba): actualización automática predicciones y auditoría $(date -u +%Y-%m-%d)"
            git push
          fi

