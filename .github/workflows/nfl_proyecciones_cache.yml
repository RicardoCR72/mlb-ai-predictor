name: NFL Proyecciones desde cache (sin creditos)

# Usa las odds ya descargadas en cache local para regenerar proyecciones
# sin gastar ningun credito de The Odds API.
# Ejecuta manualmente cuando las lineas ya estan en cache y solo
# quieres regenerar las proyecciones o corregir algun calculo.

on:
  workflow_dispatch:
    inputs:
      semana:
        description: 'Semana NFL a reprocesar (dejar vacio = semana actual)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nfl-proyecciones-cache
  cancel-in-progress: false

jobs:
  proyecciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_HOST: ${{ secrets.NFL_DB_HOST || secrets.DB_HOST }}
      DB_PORT: ${{ secrets.NFL_DB_PORT || secrets.DB_PORT }}
      DB_USER: ${{ secrets.NFL_DB_USER || secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.NFL_DB_PASSWORD || secrets.DB_PASSWORD || secrets.DB_PASS }}
      DB_NAME: ${{ secrets.NFL_DB_NAME || secrets.DB_NAME }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements_nfl_actions.txt

      - name: Instalar dependencias NFL
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_nfl_actions.txt

      - name: Preparar certificado de Aiven
        shell: bash
        env:
          NFL_DB_SSL_CA_CERT: ${{ secrets.NFL_DB_SSL_CA_CERT || secrets.DB_SSL_CA_CERT }}
        run: |
          if [ -z "$NFL_DB_SSL_CA_CERT" ]; then
            echo "Falta NFL_DB_SSL_CA_CERT o DB_SSL_CA_CERT"
            exit 1
          fi
          printf '%s' "$NFL_DB_SSL_CA_CERT" > "$RUNNER_TEMP/aiven-ca.pem"

      # Restaura las odds cacheadas de la semana actual
      # Si no hay cache, el paso de reprocesar simplemente no encontrara datos.
      - name: Semana del cache
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restaurar cache de odds
        uses: actions/cache@v4
        with:
          path: data/nfl/cache/odds_props
          key: nfl-odds-cache-${{ steps.week.outputs.key }}
          restore-keys: |
            nfl-odds-cache-

      - name: Reprocesar lineas desde cache (0 creditos)
        env:
          PYTHONUNBUFFERED: '1'
          DB_SSL_CA: ${{ runner.temp }}/aiven-ca.pem
        run: |
          python nfl/actualizar_lineas_props.py \
            --usar-cache \
            --reconstruir-semana

      - name: Regenerar proyecciones de props
        env:
          PYTHONUNBUFFERED: '1'
          DB_SSL_CA: ${{ runner.temp }}/aiven-ca.pem
        run: python nfl/predecir_props_semana_actual.py
