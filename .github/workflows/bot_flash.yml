name: Flash MLB V2 - pitchers y lesiones

on:
  schedule:
    # 12:00, 15:00 y 17:00 America/Mexico_City
    - cron: '0 18,21,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Ambos bots comparten grupo: nunca actualizan el historial simultáneamente.
concurrency:
  group: mlb-v2-produccion
  cancel-in-progress: false

jobs:
  mlb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MLB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MLB_ODDS_CAPTURE_TIMEZONE: America/Mazatlan
    steps:
      - name: Descargar la rama principal actualizada
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements_mlb_actions.txt
            requirements_mlb_v2_actions.txt

      - name: Instalar dependencias MLB
        run: python -m pip install -r requirements_mlb_v2_actions.txt

      - name: Preparar secretos existentes
        id: secretos
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python -m mlb_totales.automatizar secretos

      - name: Escanear pitchers confirmados
        if: ${{ !cancelled() && steps.secretos.outcome == 'success' }}
        run: python escaner_pitchers.py

      - name: Escanear lesiones
        if: ${{ !cancelled() && steps.secretos.outcome == 'success' }}
        run: python escaner_lesiones.py

      - name: Eliminar archivo temporal de secretos
        if: ${{ always() }}
        run: python -c "from pathlib import Path; Path('.streamlit/secrets.toml').unlink(missing_ok=True)"
