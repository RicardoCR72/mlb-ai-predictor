name: Captura de Cierres CLV y Auditoría Pública

on:
  schedule:
    # ---------------- HORARIOS DE CIERRE (NBA y NFL) ----------------
    # 1. Domingo NFL Bloque 1 (12:00 PM CDMX = 18:00 UTC -> 17:50 UTC)
    - cron: '50 17 * * 0'
    # 2. Domingo NFL Bloque 2 Tarde (15:05/15:25 CDMX = 21:05/21:25 UTC -> 20:55 UTC y 21:15 UTC)
    - cron: '55 20 * * 0'
    - cron: '15 21 * * 0'
    # 3. Jornada NBA y Sunday/Monday Night NFL (18:00 a 21:30 CDMX = 00:00 a 03:30 UTC)
    # Ventanas cada 30-35 minutos durante las horas de juego:
    - cron: '50 23 * * *'  # 17:50 CDMX (juegos 18:00)
    - cron: '25 0 * * *'   # 18:25 CDMX (juegos 18:30)
    - cron: '55 0 * * *'   # 18:55 CDMX (juegos 19:00)
    - cron: '25 1 * * *'   # 19:25 CDMX (Sunday/Monday Night & juegos 19:30)
    - cron: '55 1 * * *'   # 19:55 CDMX (juegos 20:00)
    - cron: '55 2 * * *'   # 20:55 CDMX (juegos tardíos Costa Oeste 21:00/21:30)
    # 4. Liquidación nocturna y reporte final (23:45 CDMX = 05:45 UTC siguiente día)
    - cron: '45 5 * * *'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Acción a ejecutar'
        required: true
        default: 'cierres_y_reporte'
        type: choice
        options:
          - 'cierres_y_reporte'
          - 'liquidar_y_reporte'
          - 'solo_cierres'
          - 'solo_reporte'

permissions:
  contents: write

concurrency:
  group: auditoria-clv-pipeline
  cancel-in-progress: false

jobs:
  procesar-auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias esenciales
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 scipy pyarrow mysql-connector-python

      - name: Ejecutar Captura de Cierres (NBA y NFL)
        if: ${{ github.event.inputs.modo != 'liquidar_y_reporte' && github.event.inputs.modo != 'solo_reporte' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          echo "🔍 Capturando cuotas de cierre NBA..."
          python -m nba.cierres_programados --una-vez --ventana-min 25 || true

          echo "🔍 Capturando cuotas de cierre NFL..."
          python -m nfl.cierres_programados --una-vez --ventana-min 25 || true

      - name: Liquidación Nocturna (si corresponde)
        if: ${{ github.event.schedule == '45 5 * * *' || github.event.inputs.modo == 'liquidar_y_reporte' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          echo "⚖️ Liquidando picks concluidos de NBA..."
          python -m nba.auditoria_publica liquidar || true

      - name: Generar Reportes Públicos HTML y Verificar Integridad
        run: |
          echo "🔒 Verificando ledger NBA..."
          python -m nba.auditoria_publica verificar || true
          python -m nba.publicar_reporte || true

          echo "🔒 Verificando ledger NFL..."
          python -m nfl.auditoria_publica verificar || true
          python -m nfl.publicar_reporte || true

      - name: Sincronizar Cierres y Reportes al Repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/nba/audit/ data/nfl/audit/
          if git diff --staged --quiet; then
            echo "Sin cambios en los ledgers ni en los reportes públicos."
          else
            git commit -m "chore(audit): auto-captura cierres y sellado de reporte publico [skip ci]"
            git push origin main
          fi
