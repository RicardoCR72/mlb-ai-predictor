name: Actualizar Liga MX (ESPN)

on:
  schedule:
    # Diario a las 12:00 UTC (06:00 CDMX), para mantener la auditoría vigente.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Inicio del escaneo (AAAA-MM-DD, opcional)'
        required: false
        default: ''
      hasta:
        description: 'Fin del escaneo (AAAA-MM-DD, opcional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: actualizar-liga-mx
  cancel-in-progress: false

jobs:
  liga-mx:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      # Cache de respuestas ESPN (evita repetir peticiones ya procesadas)
      - name: Cache ESPN responses
        uses: actions/cache@v4
        with:
          path: |
            futbol_liga_mx/data/cache/espn_events.json
            futbol_liga_mx/data/cache/espn_2025_26
          key: liga-mx-espn-${{ github.run_id }}
          restore-keys: |
            liga-mx-espn-

      - name: Recuperar temporada faltante sin reentrenar
        run: python -m futbol_liga_mx.recuperar_historial

      - name: Evaluar temporada adicional sin reentrenar
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import pandas as pd
          from futbol_liga_mx.datos import complete
          from futbol_liga_mx.continuidad import evaluate_2025, frozen_model
          from futbol_liga_mx.inferencia import normalize_teams
          games = normalize_teams(pd.read_csv('futbol_liga_mx/data/partidos.csv'))
          if complete(games[games.season.eq('2025-26')]):
              params, metrics = frozen_model('futbol_liga_mx/modelos')
              evaluate_2025(games, params, metrics, 'futbol_liga_mx/modelos/confirmacion_2025_26.json')
          PYCODE

      - name: Actualizar partidos y proximos desde ESPN
        env:
          SCAN_DESDE: ${{ inputs.desde }}
          SCAN_HASTA: ${{ inputs.hasta }}
        run: |
          ARGS=()
          if [ -n "$SCAN_DESDE" ]; then ARGS+=(--desde "$SCAN_DESDE"); fi
          if [ -n "$SCAN_HASTA" ]; then ARGS+=(--hasta "$SCAN_HASTA"); fi
          python -m futbol_liga_mx.proveedor_espn "${ARGS[@]}"

      - name: Commit y push de los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add futbol_liga_mx/data/partidos.csv futbol_liga_mx/data/proximos.csv
          for FILE in futbol_liga_mx/data/cobertura_2025_26.json futbol_liga_mx/data/cobertura_actual.json futbol_liga_mx/modelos/confirmacion_2025_26.json; do
            if [ -f "$FILE" ]; then git add "$FILE"; fi
          done
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos de Liga MX."
          else
            git commit -m "chore(liga-mx): actualizar datos ESPN $(date -u +%Y-%m-%d)"
            git push
          fi

