name: Actualizar Liga MX (ESPN)

on:
  schedule:
    # Martes y viernes a las 12:00 UTC (06:00 CDMX)
    # Cubre resultados del fin de semana y actualiza proximos partidos
    - cron: '0 12 * * 2'
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Inicio del escaneo (AAAA-MM-DD, opcional)'
        required: false
        default: ''
      hasta:
        description: 'Fin del escaneo (AAAA-MM-DD, opcional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: actualizar-liga-mx
  cancel-in-progress: false

jobs:
  liga-mx:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      # Cache de respuestas ESPN (evita repetir peticiones ya procesadas)
      - name: Cache ESPN responses
        uses: actions/cache@v4
        with:
          path: futbol_liga_mx/data/cache/espn_events.json
          key: liga-mx-espn-${{ github.run_id }}
          restore-keys: |
            liga-mx-espn-

      - name: Actualizar partidos y proximos desde ESPN
        run: |
          ARGS=""
          if [ -n "${{ inputs.desde }}" ]; then
            ARGS="$ARGS --desde ${{ inputs.desde }}"
          fi
          if [ -n "${{ inputs.hasta }}" ]; then
            ARGS="$ARGS --hasta ${{ inputs.hasta }}"
          fi
          python -m futbol_liga_mx.proveedor_espn $ARGS

      - name: Commit y push de los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add futbol_liga_mx/data/partidos.csv futbol_liga_mx/data/proximos.csv || true
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos de Liga MX."
          else
            git commit -m "chore(liga-mx): actualizar datos ESPN $(date -u +%Y-%m-%d)"
            git push
          fi
