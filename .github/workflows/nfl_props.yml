name: Actualizar props NFL

on:
  workflow_dispatch:
    inputs:
      actualizar_odds:
        description: "Consultar The Odds API (consume créditos)"
        required: true
        type: boolean
        default: false
  schedule:
    # Jueves 16:00: captura TNF.
    - cron: "0 22 * * 4"
    # Viernes 08:00: liquida TNF sin consultar odds.
    - cron: "0 14 * * 5"
    # Domingo 10:00: captura la jornada dominical.
    - cron: "0 16 * * 0"
    # Domingo 17:00 de Durango/CDMX (UTC-6).
    - cron: "0 23 * * 0"
    # Lunes 16:00: captura MNF.
    - cron: "0 22 * * 1"
    # Martes 08:00: liquida MNF y el resto de la semana sin odds.
    - cron: "0 14 * * 2"

permissions:
  contents: read

concurrency:
  group: actualizar-props-nfl
  cancel-in-progress: false

jobs:
  props-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_nfl_actions.txt

      - name: Instalar dependencias NFL
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_nfl_actions.txt

      - name: Preparar certificado de Aiven
        shell: bash
        env:
          NFL_DB_SSL_CA_CERT: ${{ secrets.NFL_DB_SSL_CA_CERT || secrets.DB_SSL_CA_CERT }}
        run: |
          if [ -z "$NFL_DB_SSL_CA_CERT" ]; then
            echo "Falta NFL_DB_SSL_CA_CERT o DB_SSL_CA_CERT"
            exit 1
          fi
          printf '%s' "$NFL_DB_SSL_CA_CERT" > "$RUNNER_TEMP/aiven-ca.pem"

      - name: Validar secretos de MySQL
        shell: bash
        env:
          DB_HOST: ${{ secrets.NFL_DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ secrets.NFL_DB_PORT || secrets.DB_PORT }}
          DB_USER: ${{ secrets.NFL_DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.NFL_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.NFL_DB_NAME || secrets.DB_NAME }}
        run: |
          faltantes=0
          for variable in DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME; do
            if [ -z "${!variable}" ]; then
              echo "Falta el secreto NFL_${variable} o ${variable}"
              faltantes=1
            fi
          done
          if [ "$faltantes" -ne 0 ]; then
            exit 1
          fi
          echo "Secretos de MySQL disponibles."

      - name: Evaluar props terminados
        env:
          PYTHONUNBUFFERED: "1"
          DB_HOST: ${{ secrets.NFL_DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ secrets.NFL_DB_PORT || secrets.DB_PORT }}
          DB_USER: ${{ secrets.NFL_DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.NFL_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.NFL_DB_NAME || secrets.DB_NAME }}
          DB_SSL_CA: ${{ runner.temp }}/aiven-ca.pem
        run: python nfl/evaluar_resultados_props.py

      - name: Descargar líneas programadas de props
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '0 22 * * 4' ||
           github.event.schedule == '0 16 * * 0' ||
           github.event.schedule == '0 22 * * 1')
        env:
          PYTHONUNBUFFERED: "1"
          DB_HOST: ${{ secrets.NFL_DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ secrets.NFL_DB_PORT || secrets.DB_PORT }}
          DB_USER: ${{ secrets.NFL_DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.NFL_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.NFL_DB_NAME || secrets.DB_NAME }}
          DB_SSL_CA: ${{ runner.temp }}/aiven-ca.pem
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "0 16 * * 0" ]; then
            python nfl/actualizar_lineas_props.py --proximas-horas 14
          else
            python nfl/actualizar_lineas_props.py --proximas-horas 8
          fi

      - name: Descargar líneas manualmente
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.actualizar_odds == true
        env:
          PYTHONUNBUFFERED: "1"
          DB_HOST: ${{ secrets.NFL_DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ secrets.NFL_DB_PORT || secrets.DB_PORT }}
          DB_USER: ${{ secrets.NFL_DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.NFL_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.NFL_DB_NAME || secrets.DB_NAME }}
          DB_SSL_CA: ${{ runner.temp }}/aiven-ca.pem
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python nfl/actualizar_lineas_props.py

      - name: Generar proyecciones de props
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '0 22 * * 4' ||
          github.event.schedule == '0 16 * * 0' ||
          github.event.schedule == '0 23 * * 0' ||
          github.event.schedule == '0 22 * * 1'
        env:
          PYTHONUNBUFFERED: "1"
          DB_HOST: ${{ secrets.NFL_DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ secrets.NFL_DB_PORT || secrets.DB_PORT }}
          DB_USER: ${{ secrets.NFL_DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.NFL_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.NFL_DB_NAME || secrets.DB_NAME }}
          DB_SSL_CA: ${{ runner.temp }}/aiven-ca.pem
        run: python nfl/predecir_props_semana_actual.py
