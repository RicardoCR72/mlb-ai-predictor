name: 🤖 Oráculo Bot Automático

on:
  schedule:
    # Corre todos los días a las 11:00 AM UTC
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  rutina_diaria:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar librerías
        run: |
          pip install -r requirements.txt

      - name: 🔐 Crear archivo de secretos para Streamlit
        run: |
          mkdir -p .streamlit
          echo 'host = "${{ secrets.DB_HOST }}"' > .streamlit/secrets.toml
          echo 'port = ${{ secrets.DB_PORT }}' >> .streamlit/secrets.toml
          echo 'user = "${{ secrets.DB_USER }}"' >> .streamlit/secrets.toml
          echo 'password = "${{ secrets.DB_PASS }}"' >> .streamlit/secrets.toml
          echo 'database = "${{ secrets.DB_NAME }}"' >> .streamlit/secrets.toml

      - name: 🔄 Ejecutar actualización de marcadores y memoria
        run: python actualizar_marcadores.py

      - name: 🕵️‍♂️ Ejecutar scraper de cuotas y juegos nuevos
        run: python scraper.py

      - name: 🏥 Ejecutar escáner médico de CBS
        run: python escaner_lesiones.py

      - name: ⚾ Ejecutar escáner de pitchers abridores
        run: python escaner_pitchers.py