name: Pruebas de integración deportiva
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/requirements_mlb_v2_actions.txt PyYAML
      - name: Probar modelos e integración sin APIs ni credenciales
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -m unittest
          mlb_totales.test_automatizar mlb_totales.test_core
          mlb_totales.test_draftkings mlb_totales.test_fechas
          mlb_totales.test_integracion mlb_totales.test_pitcheo
          futbol_liga_mx.test_continuidad futbol_liga_mx.test_modelo
          tests.test_integracion_deportes tests.test_observabilidad tests.test_actualizacion_manual tests.test_ui_picks -v
  mysql-real:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: bankroll_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "pandas>=2.2,<3" mysql-connector-python requests
      - name: Persistencia, duplicados, auditoría y saldo en MySQL real
        env:
          BANKROLL_MYSQL_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: integration-only
          DB_NAME: bankroll_ci
        run: python -m unittest tests.test_bankroll_mysql -v
