name: Props NFL con limite de creditos

on:
  schedule:
    # Jueves 20:00 UTC (14:00 CDMX): captura solo partidos de hoy.
    - cron: '0 20 * 9-12,1-2 4'
    # Segundo intento si el primero no capturó; no duplica cobros del día.
    - cron: '0 22 * 9-12,1-2 4'
    # Viernes 14:00 UTC (08:00 CDMX): liquida el TNF, regenera proyecciones sin odds.
    - cron: '0 14 * 9-12,1-2 5'
    # Domingo 14:00 UTC (08:00 CDMX): jornada dominical; reintentos sin recobrar.
    - cron: '0 14 * 9-12,1-2 0'
    - cron: '0 16 * 9-12,1-2 0'
    # Domingo 22:00 UTC (16:00 CDMX): captura solo juegos de hoy sin captura previa.
    - cron: '0 22 * 9-12,1-2 0'
    # Lunes 20:00 UTC (14:00 CDMX): solo MNF del día.
    - cron: '0 20 * 9-12,1-2 1'
    - cron: '0 22 * 9-12,1-2 1'
    # Martes 14:00 UTC (08:00 CDMX): liquida MNF, regenera proyecciones sin odds.
    - cron: '0 14 * 9-12,1-2 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-props-cuota
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DB_HOST: ${{ secrets.NFL_DB_HOST || secrets.DB_HOST }}
      DB_PORT: ${{ secrets.NFL_DB_PORT || secrets.DB_PORT }}
      DB_USER: ${{ secrets.NFL_DB_USER || secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.NFL_DB_PASSWORD || secrets.DB_PASSWORD || secrets.DB_PASS }}
      DB_NAME: ${{ secrets.NFL_DB_NAME || secrets.DB_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements_nfl_actions.txt
      - run: python -m pip install -r requirements/requirements_nfl_actions.txt

      - name: Semana del catalogo
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache del catalogo de jugadores NFL
        uses: actions/cache@v4
        with:
          path: data/nfl/raw
          key: nfl-players-2026-${{ steps.week.outputs.key }}

      - name: Preparar catalogo cuando todavia no existe
        run: |
          if [ ! -f data/nfl/raw/nfl_player_stats_2012_2026.parquet ]; then
            python nfl/descargar_datos.py
          fi

      - name: Preparar certificado de Aiven
        shell: bash
        env:
          NFL_DB_SSL_CA_CERT: ${{ secrets.NFL_DB_SSL_CA_CERT || secrets.DB_SSL_CA_CERT }}
        run: |
          if [ -z "$NFL_DB_SSL_CA_CERT" ]; then
            echo "Falta NFL_DB_SSL_CA_CERT o DB_SSL_CA_CERT"
            exit 1
          fi
          printf '%s' "$NFL_DB_SSL_CA_CERT" > "$RUNNER_TEMP/aiven-ca.pem"
          printf 'DB_SSL_CA=%s\n' "$RUNNER_TEMP/aiven-ca.pem" >> "$GITHUB_ENV"

      - name: Evaluar resultados props terminados
        run: python nfl/evaluar_resultados_props.py

      # Usar el cron original: una ejecución del jueves puede empezar el viernes UTC.
      - name: Seleccionar captura programada
        id: ventana
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PYTHON'
          import os
          from nfl.jornada import captura_programada
          capture = os.environ['EVENT_NAME'] == 'workflow_dispatch' or captura_programada(os.environ['EVENT_SCHEDULE'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('capturar=' + ('true' if capture else 'false') + '\n')
          print('Captura programada:', capture, '| Solo hoy en México, antes del inicio.')
          PYTHON

      - name: Actualizar calendario y totales de hoy sin creditos
        if: steps.ventana.outputs.capturar == 'true'
        run: python nfl/predecir_semana_actual.py --solo-hoy

      - name: Comprobar modelos y props de hoy antes de gastar creditos
        if: steps.ventana.outputs.capturar == 'true'
        run: python nfl/predecir_props_semana_actual.py --solo-hoy

      - name: Capturar odds del partido de hoy
        if: steps.ventana.outputs.capturar == 'true'
        run: |
          python nfl/actualizar_lineas_props.py \
            --solo-hoy \
            --una-captura \
            --solo-draftkings \
            --reserva-creditos 120

      # ── Regenerar proyecciones despues de captura ─────────────────────────
      - name: Generar proyecciones
        env:
          CAPTURAR: ${{ steps.ventana.outputs.capturar }}
        run: |
          if [ "$CAPTURAR" = "true" ]; then
            python nfl/predecir_props_semana_actual.py --solo-hoy
          else
            python nfl/predecir_props_semana_actual.py
          fi


      - name: Liquidar apuestas realizadas de Bankroll
        run: python scripts/actualizar_bankroll.py
