name: Props NFL con límite de créditos

on:
  schedule:
    # 16:00 UTC; ventana de 24 horas hasta el comienzo del partido.
    - cron: '0 16 * 9-12 *'
    - cron: '0 16 * 1-2 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-props-cuota
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_nfl_actions.txt
      - run: python -m pip install -r requirements_nfl_actions.txt

      - name: Semana del catálogo
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache del catálogo de jugadores NFL
        uses: actions/cache@v4
        with:
          path: data/nfl/raw
          key: nfl-players-2026-${{ steps.week.outputs.key }}

      - name: Preparar catálogo cuando todavía no existe
        run: |
          if [ ! -f data/nfl/raw/nfl_player_stats_2012_2026.parquet ]; then
            python nfl/descargar_datos.py
          fi

      - name: Capturar una vez por partido, solo DraftKings
        run: |
          python nfl/actualizar_lineas_props.py \
            --proximas-horas 24 \
            --una-captura \
            --solo-draftkings \
            --reserva-creditos 120
