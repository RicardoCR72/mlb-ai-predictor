name: Actualizador Diario y Liquidación Fútbol Mundial (8 Ligas)

on:
  schedule:
    # 1. Mañana (06:00 CDMX = 12:00 UTC): Apertura de cuotas y predicciones tempranas para ligas europeas y del día
    - cron: '0 12 * * *'
    # 2. Tarde (14:30 CDMX = 20:30 UTC): Liquidación de partidos matutinos europeos y ajuste previo a Liga MX / América
    - cron: '30 20 * * *'
    # 3. Noche (23:15 CDMX = 05:15 UTC siguiente día): Liquidación final de jornada de Liga MX y auditoría de balance
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-mundial-pipeline
  cancel-in-progress: false

jobs:
  actualizar-futbol:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests pyarrow mysql-connector-python

      - name: Ejecutar Pipeline Fútbol (Liquidación de marcadores y nuevas predicciones 8 ligas)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python futbol/actualizar_futbol.py

      - name: Sincronizar y respaldar predicciones e historial en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/futbol/
          if git diff --staged --quiet; then
            echo "Sin cambios pendientes en archivos locales de Fútbol."
          else
            git commit -m "chore(futbol): actualización automática predicciones y auditoría 8 ligas $(date -u +%Y-%m-%d)"
            git push
          fi
